<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#26344f}</style></head><body><div id="c"></div>
<script src="../art/mihalych_cut.js"></script>
<script>
/* Golden panic sheet: mihalych bust crops, expression states at 2x (top) and working size (bottom). Layout is part of the golden. */
var HF=window.HF,ID="mihalych",VB="-110 -210 220 220",NAMES=["tired_neutral","deadpan","soft_smile","wince","panic","realize"],FONT="Helvetica, Arial, sans-serif";
function J(x){return JSON.parse(JSON.stringify(x))}
var W=NAMES.length*450+10,H=730,n=0;
var o='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><rect width="'+W+'" height="'+H+'" fill="#26344f"/>';
function T(x,y,s,t,fill){return '<text x="'+x+'" y="'+y+'" font-size="'+s+'" font-family="'+FONT+'" fill="'+(fill||'#efe7d2')+'">'+t+'</text>'}
function bust(x,y,sz,name,mo){var R=HF.RIG.mihalych,st={ch:'mihalych',uid:'g'+(n++),pose:J(R.poses.stand_still),expr:J(R.expr[name]),mouth:mo||0,gaze:{x:0,y:0},t:.8};
 return '<rect x="'+x+'" y="'+y+'" width="'+sz+'" height="'+sz+'" fill="#33476a"/><svg x="'+x+'" y="'+y+'" width="'+sz+'" height="'+sz+'" viewBox="'+VB+'" overflow="hidden">'+R.draw(st)+'</svg>'}
o+=T(10,22,20,'mihalych@1.0.0  expression states: 2x (top), working size (bottom)','#ffd678');
NAMES.forEach(function(nm,i){var x=10+i*450,mo=nm==='soft_smile'?.6:0;o+=bust(x,34,440,nm,mo)+T(x+6,58,20,nm+(mo?' (mouth .6)':''))+bust(x+110,34+444,220,nm,mo)});
o+='</svg>';document.getElementById('c').innerHTML=o;window.__ok=1;
</script></body></html>
